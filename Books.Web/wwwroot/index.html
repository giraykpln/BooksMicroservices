<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Books</span>
        </div>
    </nav>

    <div class="container">
        <div id="message" class="alert d-none"></div>

        <div class="card mb-4">
            <div class="card-header" id="bookFormTitle">Add Book</div>
            <div class="card-body">
                <form id="bookForm" class="row g-3">
                    <input id="bookId" type="hidden" />
                    <div class="col-md-6">
                        <label class="form-label" for="name">Name</label>
                        <input id="name" class="form-control" maxlength="150" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="authorId">Author</label>
                        <select id="authorId" class="form-select" required></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="numberOfPages">Number of Pages</label>
                        <input id="numberOfPages" type="number" min="1" class="form-control" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="publishDate">Publish Date</label>
                        <input id="publishDate" type="date" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="price">Price</label>
                        <input id="price" type="number" min="0" step="0.01" class="form-control" required />
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input id="isTopSeller" type="checkbox" class="form-check-input" />
                            <label class="form-check-label" for="isTopSeller">Top Seller</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Genres</label>
                        <div id="genres"></div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-success" type="submit">Save</button>
                        <button id="cancelButton" class="btn btn-secondary" type="button">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Genres</th>
                    <th>Pages</th>
                    <th>Publish Date</th>
                    <th>Price</th>
                    <th>Top Seller</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="books"></tbody>
        </table>
    </div>

    <script src="js/site.js"></script>
</body>
</html>
